<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ChatDeck isolated demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: "Aptos Display", "Segoe UI", "Microsoft YaHei", sans-serif;
        background: #111318;
        color: #f4f1ea;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #111318; overflow: hidden; }
      .workspace { display: grid; grid-template-columns: 248px 1fr; min-height: 100vh; }
      .sidebar { padding: 26px 20px; border-right: 1px solid rgba(244,241,234,.1); background: #15171d; }
      .mark { display: flex; gap: 10px; align-items: center; font-weight: 800; letter-spacing: -.03em; }
      .markDot { width: 22px; height: 22px; border-radius: 7px; background: #6878ff; box-shadow: 0 0 28px rgba(104,120,255,.38); }
      .sideLabel { margin: 52px 0 12px; font: 700 11px/1.2 "Cascadia Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: rgba(244,241,234,.4); }
      .navItem { padding: 11px 12px; border-radius: 10px; color: rgba(244,241,234,.64); font-size: 14px; }
      .navItem.active { color: #f4f1ea; background: rgba(104,120,255,.13); }
      .main { position: relative; min-width: 0; padding: 30px 42px; background: radial-gradient(circle at 80% 12%, rgba(104,120,255,.12), rgba(17,19,24,0) 33%), #111318; }
      .topline { display: flex; justify-content: space-between; align-items: center; color: rgba(244,241,234,.56); font: 700 12px/1.2 "Cascadia Mono", monospace; letter-spacing: .05em; }
      .pill { padding: 7px 10px; border: 1px solid rgba(217,243,108,.34); border-radius: 999px; color: #d9f36c; background: rgba(217,243,108,.07); }
      .hero { max-width: 760px; margin-top: 18vh; }
      .eyebrow { color: #6878ff; font: 700 13px/1.2 "Cascadia Mono", monospace; letter-spacing: .16em; text-transform: uppercase; }
      h1 { max-width: 720px; margin: 18px 0 20px; font-size: clamp(42px, 6vw, 88px); line-height: .98; letter-spacing: -.065em; }
      .hero p { max-width: 540px; margin: 0; color: rgba(244,241,234,.62); font-size: 19px; line-height: 1.6; }
      .composer { position: absolute; right: 42px; bottom: 34px; left: 42px; display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; border: 1px solid rgba(244,241,234,.12); border-radius: 18px; color: rgba(244,241,234,.38); background: rgba(244,241,234,.045); }
      .composerKey { color: rgba(244,241,234,.6); font: 700 11px/1 "Cascadia Mono", monospace; }
      .sandbox { position: fixed; right: 18px; top: 18px; z-index: 2147483647; padding: 9px 12px; border: 1px solid rgba(217,243,108,.5); border-radius: 999px; color: #d9f36c; background: rgba(17,19,24,.88); font: 700 11px/1 "Cascadia Mono", monospace; letter-spacing: .08em; }
      @media (max-width: 800px) { .workspace { grid-template-columns: 1fr; } .sidebar { display: none; } .main { padding: 24px; } .composer { right: 24px; left: 24px; } }
    </style>
  </head>
  <body>
    <div class="sandbox">SANDBOX · SYNTHETIC DATA</div>
    <div class="workspace">
      <aside class="sidebar">
        <div class="mark"><span class="markDot"></span><span>ChatGPT</span></div>
        <div class="sideLabel">Workspace</div>
        <div class="navItem active">新对话</div>
        <div class="navItem">收藏</div>
        <div class="navItem">设置</div>
        <div class="sideLabel">Demo note</div>
        <div class="navItem">This page is local-only.</div>
      </aside>
      <main class="main">
        <div class="topline"><span>CHATGPT / DEMO WORKSPACE</span><span class="pill">local fixture</span></div>
        <section class="hero">
          <div class="eyebrow">Card Manager · v1.17.0</div>
          <h1>把历史对话，变成可以操作的卡片。</h1>
          <p>这是一个隔离的本地演示页面。右下角按钮打开 ChatDeck，所有内容来自合成夹具，不会读取真实账号数据。</p>
        </section>
        <div class="composer"><span>向 ChatGPT 提问……</span><span class="composerKey">⌘ K</span></div>
      </main>
    </div>
    <script>
      (async () => {
        const fixture = await fetch('/demo/test-fixtures/conversations.json', { cache: 'no-store' }).then((res) => res.json());
        const databaseName = 'chatdeck-cache-v1';
        const database = await new Promise((resolve, reject) => {
          const request = indexedDB.open(databaseName, 1);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains('conversations')) db.createObjectStore('conversations', { keyPath: 'id' });
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
        await new Promise((resolve, reject) => {
          const tx = database.transaction('conversations', 'readwrite');
          const store = tx.objectStore('conversations');
          fixture.items.slice(0, 5).forEach((item) => {
            const detail = fixture.details[item.id];
            store.put({
              id: item.id,
              messages: detail.cacheMessages,
              mediaSchema: 2,
              parserSchema: 3,
              createdAt: Date.parse(item.create_time),
              listUpdatedAt: Date.parse(item.update_time),
              cachedAt: Date.now(),
            });
          });
          tx.oncomplete = resolve;
          tx.onerror = () => reject(tx.error);
          tx.onabort = () => reject(tx.error);
        });
        window.__CHATDECK_DEMO__ = {
          databaseName,
          databaseOrigin: location.origin,
          seededConversationIds: fixture.items.slice(0, 5).map((item) => item.id),
          syntheticConversationCount: fixture.items.length,
        };
        const contentScript = document.createElement('script');
        contentScript.src = '/content.js';
        document.body.append(contentScript);
      })().catch((error) => {
        document.body.dataset.demoError = String(error);
        console.error('[ChatDeck demo]', error);
      });
    </script>
  </body>
</html>
